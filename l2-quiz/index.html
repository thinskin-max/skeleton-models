function esc(s) {
  return String(s)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;");
}

function optionText(q, key) {
  for (var i = 0; i < q.options.length; i++) {
    if (q.options[i].key === key) return q.options[i].text;
  }
  return "";
}

function renderQuestions() {
  var form = document.getElementById("quizForm");
  var html = "";
  for (var i = 0; i < QUESTIONS.length; i++) {
    var q = QUESTIONS[i];
    html += '<div class="q" id="q-' + q.id + '" data-qid="' + q.id + '">';
    html += '<p class="q-title">' + esc(q.text) + "</p>";
    html += '<div class="opts" role="radiogroup" aria-label="題目 ' + q.id + '">';
    for (var j = 0; j < q.options.length; j++) {
      var o = q.options[j];
      var oid = "q" + q.id + "_" + o.key;
      html += '<label class="opt" for="' + oid + '">';
      html +=
        '<input type="radio" name="q' +
        q.id +
        '" id="' +
        oid +
        '" value="' +
        o.key +
        '">';
      html += "<span>(" + o.key + ") " + esc(o.text) + "</span>";
      html += "</label>";
    }
    html += "</div>";
    html += '<div class="feedback" id="fb-' + q.id + '"></div>';
    html += "</div>";
  }
  form.innerHTML = html;
  document.getElementById("qCount").textContent = String(QUESTIONS.length);
  document.getElementById("passPct").textContent = String(Math.round(PASS_MARK * 100));
}

function getAnswer(qid) {
  var els = document.getElementsByName("q" + qid);
  for (var i = 0; i < els.length; i++) {
    if (els[i].checked) return els[i].value;
  }
  return null;
}

function grade() {
  var total = QUESTIONS.length;
  var correct = 0;
  var unanswered = 0;

  for (var i = 0; i < QUESTIONS.length; i++) {
    var q = QUESTIONS[i];
    var card = document.getElementById("q-" + q.id);
    var fb = document.getElementById("fb-" + q.id);
    var picked = getAnswer(q.id);
    card.classList.remove("correct", "wrong");

    if (!picked) {
      unanswered++;
      card.classList.add("wrong");
      fb.innerHTML =
        "<strong>未作答。</strong> 正確答案：(" +
        q.answer +
        ") " +
        esc(optionText(q, q.answer)) +
        (q.note ? "<br>" + esc(q.note) : "");
      continue;
    }

    if (picked === q.answer) {
      correct++;
      card.classList.add("correct");
      fb.innerHTML =
        "<strong>正確。</strong> 答案：(" +
        q.answer +
        ") " +
        esc(optionText(q, q.answer)) +
        (q.note ? "<br>" + esc(q.note) : "");
    } else {
      card.classList.add("wrong");
      fb.innerHTML =
        "<strong>唔啱。</strong> 你揀咗 (" +
        picked +
        ") " +
        esc(optionText(q, picked)) +
        "。<br>正確答案：(" +
        q.answer +
        ") " +
        esc(optionText(q, q.answer)) +
        (q.note ? "<br>" + esc(q.note) : "");
    }
  }

  var pct = total ? correct / total : 0;
  var pctShow = Math.round(pct * 1000) / 10;
  var passed = pct >= PASS_MARK;
  var name = (document.getElementById("studentName").value || "").trim();

  var result = document.getElementById("result");
  var html = "<h2>成績</h2>";
  if (name) {
    html += '<p class="score-line">考生：<strong>' + esc(name) + "</strong></p>";
  }
  html +=
    '<p class="score-line">得分：<strong>' +
    correct +
    " / " +
    total +
    "</strong>（" +
    pctShow +
    "%）</p>";
  html +=
    '<span class="badge ' +
    (passed ? "pass" : "fail") +
    '">' +
    (passed ? "合格" : "未合格") +
    "</span>";
  html +=
    '<p class="pass-note" style="margin-top:10px">合格分數：' +
    Math.round(PASS_MARK * 100) +
    "%</p>";
  if (unanswered > 0) {
    html +=
      '<p class="unanswered-warn">有 ' +
      unanswered +
      " 題未作答，已計作錯。</p>";
  }
  result.innerHTML = html;
  result.classList.add("show");
  result.scrollIntoView({ behavior: "smooth", block: "start" });
}

function resetQuiz() {
  var form = document.getElementById("quizForm");
  form.reset();
  for (var i = 0; i < QUESTIONS.length; i++) {
    var q = QUESTIONS[i];
    var card = document.getElementById("q-" + q.id);
    var fb = document.getElementById("fb-" + q.id);
    card.classList.remove("correct", "wrong");
    fb.innerHTML = "";
  }
  var result = document.getElementById("result");
  result.classList.remove("show");
  result.innerHTML = "";
  window.scrollTo({ top: 0, behavior: "smooth" });
}

document.getElementById("submitBtn").addEventListener("click", grade);
document.getElementById("resetBtn").addEventListener("click", resetQuiz);
document.getElementById("quizForm").addEventListener("submit", function (e) {
  e.preventDefault();
  grade();
});

renderQuestions();

// Expose for headless validation
window.__QUIZ__ = {
  QUESTIONS: QUESTIONS,
  PASS_MARK: PASS_MARK,
  grade: grade,
  getAnswer: getAnswer,
  optionText: optionText
};
</script>
</body>
</html>
